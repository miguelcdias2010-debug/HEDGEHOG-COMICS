<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedgehog Drawings - Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h2>✍️ Sua Opinião Importa!</h2>
        
        <form id="formFeedback" class="card form-container" onsubmit="enviarFeedback(event)">
            <div class="input-group">
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" required placeholder="Como quer ser chamado?">
            </div>

            <div class="input-group">
                <label for="mensagem">O que você está achando do curso?</label>
                <textarea id="mensagem" required rows="5" placeholder="Deixe suas críticas, sugestões ou elogios aqui..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar Avaliação</button>
        </form>

        <a href="index.html" class="btn-voltar">⬅️ Voltar ao Início</a>
    </div>
    <script src="jv.js"></script>
</body>
</html>
