<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedgehog Drawings - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h2>🔐 Entrar na Sua Conta</h2>
        
        <form id="formLogin" class="card form-container" onsubmit="realizarLogin(event)">
            <div class="input-group">
                <label for="email">E-mail cadastrado:</label>
                <input type="email" id="email" required placeholder="exemplo@email.com">
            </div>
            
            <div class="input-group">
                <label for="senha">Sua Senha:</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn btn-primary">Fazer Login</button>
        </form>

        <a href="index.html" class="btn-voltar">⬅️ Voltar ao Início</a>
    </div>
    <script src="jv.js"></script>
</body>
</html>
